version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only propose versions published at least 14 days ago, so compromised or
    # yanked releases are usually caught before they reach this repository.
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ["pytest*", "mypy*", "ruff*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
