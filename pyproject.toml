[project]
name = "colsemantics"
version = "0.4.2"
description = "Infer the meaning and PII sensitivity of tabular columns from names, values, and context. Brazilian and US formats (CPF, CNPJ, CEP, SSN, ZIP, phone, address)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Caio" }]
requires-python = ">=3.11"
keywords = [
    "semantic-inference", "semantic-types", "column-classification", "column-type-detection",
    "data-profiling", "data-classification", "data-catalog", "data-governance", "schema-inference",
    "pii", "pii-detection", "lgpd", "gdpr", "cpf", "cnpj", "brazil", "csv", "etl", "data-quality",
]  # fmt: skip
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "rapidfuzz>=3.14.6",
    "unidecode>=1.4.0",
    "PyYAML>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Caio-Analytics/colsemantics"
Repository = "https://github.com/Caio-Analytics/colsemantics"
Documentation = "https://github.com/Caio-Analytics/colsemantics/blob/main/docs/README.md"
Issues = "https://github.com/Caio-Analytics/colsemantics/issues"
Changelog = "https://github.com/Caio-Analytics/colsemantics/blob/main/CHANGELOG.md"

[project.scripts]
colsemantics = "colsemantics.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "mypy>=2.4.1", "ruff>=0.17.4"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colsemantics = ["py.typed", "calibration.json", "data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # comprimento de linha é responsabilidade do formatter
]

[tool.mypy]
python_version = "3.11"
files = ["src/colsemantics"]
ignore_missing_imports = true
warn_unused_ignores = true
strict = true

[tool.coverage.run]
source = ["colsemantics"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
