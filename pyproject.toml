[project]
name = "colsemantics"
version = "0.1.0"
description = "Inferência semântica de colunas: descobre o papel (o que a coluna é) e o domínio (do que ela fala) a partir do nome, de abreviações corporativas e do conteúdo."
readme = "README.md"
license = "MIT"
authors = [{ name = "Caio" }]
requires-python = ">=3.10"
keywords = ["semantic", "data-profiling", "column-inference", "pii", "etl", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "rapidfuzz>=3.0",
    "unidecode>=1.3",
]

[project.urls]
Homepage = "https://github.com/Caio-Analytics/colsemantics"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colsemantics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # comprimento de linha é responsabilidade do formatter
]

[tool.mypy]
python_version = "3.10"
files = ["src/colsemantics"]
ignore_missing_imports = true
warn_unused_ignores = true
